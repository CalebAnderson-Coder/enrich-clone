services:
  - type: web
    name: agency-fleet-runtime
    env: node
    region: ohio
    buildCommand: npm install --include=dev && npm run heroku-postbuild
    startCommand: npm start
    envVars:
      # ── Backend Runtime ──────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"

      - key: GEMINI_API_KEY
        sync: false
      # NVIDIA NIM (LLaMA) primary LLM. Was set manually in Render
      # dashboard prior to BK-032; declared here so IaC tracks it.
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # NVIDIA_API_KEY: cliente OpenAI-compat para integrate.api.nvidia.com.
      # Required como primary o fallback en lib/AgentRuntime.js. Si falta y
      # PRIMARY_LLM=gemini, el sistema queda SIN fallback y los agentes con
      # iteraciones intensivas (Helena) topan cuota Gemini sin recovery.
      # Incidente 2026-04-25→28: la key se perdió del runtime, pipeline congelado.
      - key: NVIDIA_API_KEY
        sync: false

      # PRIMARY_LLM: switch primario/fallback en lib/AgentRuntime.js (commit 21ab4a6).
      # Default = "" (NVIDIA primary, Gemini fallback). Set to "gemini" cuando NVIDIA
      # esté topado en cuota — Gemini se vuelve primario y NVIDIA queda como fallback.
      - key: PRIMARY_LLM
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: BRIGHTDATA_API_TOKEN
        sync: false
      - key: APIFY_API_TOKEN
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"

      - key: API_SECRET_KEY
        sync: false

      # DataForSEO API — used by lib/miniAudit.js for the per-lead SEO
      # findings that Ángela cites in cold emails. Configure in Render
      # dashboard: Settings → Environment → add the 3 keys with the
      # values from console.dataforseo.com → API Access.
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: DATAFORSEO_AUTH_BASIC
        sync: false

      # Multi-tenant: UUID of the brand this worker serves (Phase B single-tenant).
      # Default = Empírika. When onboarding a 2nd tenant, deploy a separate service
      # with a different BRAND_ID value.
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"

      # FRONTEND_URL = Render public URL (set after first deploy)
      - key: FRONTEND_URL
        sync: false

      # ── Frontend Build Variables (VITE_ prefix) ──────────────────
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_SERVICE_KEY
        sync: false
      - key: VITE_API_SECRET_KEY
        sync: false
      # VITE_API_URL vacío => usa /api relativo en producción
      - key: VITE_API_URL
        value: ""

      # ── Sprint 1: Autonomía (DISABLED by default; flip to "true" in dashboard when ready) ──
      - key: AUTONOMY_ENABLED
        value: "false"
      - key: AUTO_APPROVE_TIMEOUT_MS
        value: "7200000"
      # MAGNET_INSTANT_SEND: cuando "true", el lead-magnet salta el DRAFT y queda
      # APPROVED inmediatamente. El dispatcher autónomo (f93d144) lo enviará en su
      # próximo ciclo, sin esperar revisión humana. Pedido cliente Empírika 04-27.
      - key: MAGNET_INSTANT_SEND
        value: "false"
      - key: MAX_SENDS_PER_HOUR
        value: "30"
      - key: MAX_LEADS_PER_DAY_PER_BRAND
        value: "50"
      - key: BOUNCE_RATE_CIRCUIT_BREAKER
        value: "0.05"

      # ── Sprint 4: Lead magnet bucket (Supabase Storage público) ──
      - key: SUPABASE_LEAD_MAGNET_BUCKET
        value: "lead-magnets"

      # ── Sprint 2: Learning loop ──
      - key: LEARNING_ENABLED
        value: "true"
      - key: PIXEL_BASE_URL
        sync: false
      - key: GHL_WEBHOOK_SECRET
        sync: false

      # ── Sprint 3: Estratega (agente #10) — DISABLED por default ──
      - key: ESTRATEGA_ENABLED
        value: "false"
      - key: ESTRATEGA_DAILY_HOUR_UTC
        value: "23"
      - key: ESTRATEGA_WEEKLY_DAY
        value: "0"
      - key: ESTRATEGA_WEEKLY_HOUR_UTC
        value: "12"

      # ── Sprint 5: Multichannel (WhatsApp Baileys + SMS Twilio) ──
      - key: MULTICHANNEL_ENABLED
        value: "false"
      - key: WA_WARMUP_WEEK1_CAP
        value: "5"
      - key: WA_WARMUP_WEEK2_CAP
        value: "15"
      - key: WA_WARMUP_WEEK3_CAP
        value: "30"
      - key: WA_WARMUP_WEEK4PLUS_CAP
        value: "50"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # ── Sprint 5: Dashboard V2 (LeadDetailView /leads/:id) ──
      - key: DASHBOARD_V2_ENABLED
        value: "false"
      - key: VITE_DASHBOARD_V2_ENABLED
        value: "false"

  # ── Domain validator: nightly ghost-URL purge ────────────────
  # Runs daily at 03:00 UTC. Nulls out leads.website for domains that
  # fail 4xx/5xx/DNS/timeout. Prevents fantasmas (see project_gmaps_audit.md).
  - type: cron
    name: validate-lead-domains-nightly
    env: node
    region: ohio
    schedule: "0 3 * * *"
    buildCommand: npm install --include=dev
    startCommand: node scripts/validate_lead_domains.js --apply
    envVars:
      # Inherit secrets from web service to avoid manual per-cron env setup
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY

  # ── Morning briefing: Layer 2 v5 daily ritual ────────────────
  # Runs daily at 13:00 UTC (9 ET / 8 CDMX). Reads autonomy_audits y
  # produce JSON dispatch plan + ledger row en autonomy_briefings.
  # Plan: .omc/plans/autonomy-3layer-v2.md §B.4 + v5 W0/W1.
  - type: cron
    name: empirika-morning-briefing
    env: node
    region: ohio
    schedule: "0 13 * * *"
    buildCommand: npm install --include=dev
    startCommand: node scripts/morning_briefing.js --with-dispatch
    envVars:
      # Inherit secrets from web service to avoid manual per-cron env setup
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"

  # ── Follow-up 48h: deterministic email bump ──────────────────
  # Runs hourly. Sends a Spanish-only soft-bump to every lead that
  # was first-contacted by email ≥48h ago and hasn't replied,
  # bounced, unsubscribed, or already received a follow-up.
  # 14-day age ceiling prevents spamming stale contacts.
  # No LLM dependency — survives Gemini/NVIDIA outages.
  # Logs outreach_events (followup_sent), syncs GHL note + tag.
  - type: cron
    name: empirika-followup-48h
    env: node
    region: ohio
    schedule: "0 * * * *"
    buildCommand: npm install --include=dev
    startCommand: node scripts/followup_48h.js
    envVars:
      # Inherit secrets from web service (avoids manual per-cron env setup
      # that was leaving this cron in Failed-build state since 2026-05-06).
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: SMTP_USER
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_USER
      - key: SMTP_PASS
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_PASS
      - key: SMTP_FROM_NAME
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_FROM_NAME
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMPIRIKA_GHL_KEY
        sync: false
      - key: EMPIRIKA_GHL_LOCATION_ID
        value: "uQPxZOmT4zVlMHfOGRw2"
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"
      - key: FOLLOWUP_HOURS
        value: "48"
      - key: FU_MAX_AGE_DAYS
        value: "14"
      - key: FU_MAX_PER_HOUR
        value: "30"

  # ── Lead-magnet outreach cron — Ángela autónoma ──
  # 3 ventanas comerciales por día (9am, 1pm, 5pm ET = 13/17/21 UTC).
  # Pull HOT leads con email verificado + mini-audit cargado +
  # outreach_status=PENDING/sin contactar. Para cada uno: Ángela
  # escribe email lead-magnet, SMTP send, marca lead NUEVO. Caps:
  # batch_size=5/cycle, daily_cap=15. Lun-vie únicamente.
  - type: cron
    name: empirika-lead-magnet
    env: node
    region: ohio
    schedule: "0 13,17,21 * * 1-5"
    buildCommand: npm install --include=dev
    startCommand: node workers/lead_magnet_dispatcher.js
    envVars:
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: SMTP_USER
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_USER
      - key: SMTP_PASS
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_PASS
      - key: SMTP_FROM_NAME
        value: "Ángela · Empírika"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: NVIDIA_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: NVIDIA_API_KEY
      - key: HUNTER_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: HUNTER_API_KEY
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"
      - key: LEAD_MAGNET_BATCH_SIZE
        value: "5"
      - key: LEAD_MAGNET_DAILY_CAP
        value: "15"
      - key: LEAD_MAGNET_REPLY_TO
        value: "jsanchez@empirikagroup.com"

  # ── Email enrichment cron (cascade Hunter → scraping → NO_EMAIL) ──
  # Cada hora enriquece leads HOT/WARM sin email verificado. Reemplaza
  # el patrón "guess info@dominio" que generó 8 bounces. Si el cascade
  # no encuentra email real, marca el lead NO_EMAIL para que el
  # outreach_dispatcher lo skipee automáticamente.
  - type: cron
    name: empirika-email-enrichment
    env: node
    region: ohio
    schedule: "15 * * * *"
    buildCommand: npm install --include=dev
    startCommand: node workers/email_enrichment_cron.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"
      - key: EMAIL_ENRICH_BATCH
        value: "25"

  # ── Inbox → outreach_events.replied cron ──
  # Cada 5 min se conecta por IMAP al inbox de Empírika, busca emails
  # que sean respuesta a outreach previo, los matchea contra leads via
  # message_id header o from_email, y los inserta como event_type=
  # 'replied' (o 'bounced' si es notificación de mailer-daemon) para
  # que el dashboard /replies y el cron reply_to_report los vean.
  - type: cron
    name: empirika-inbox-reply
    env: node
    region: ohio
    schedule: "*/5 * * * *"
    buildCommand: npm install --include=dev
    startCommand: node workers/inbox_reply_cron.js
    envVars:
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: SMTP_USER
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_USER
      - key: SMTP_PASS
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_PASS
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"

  # ── Reply → Mini-Report PDF cron ──
  # Cuando un lead responde positivo ("sí, mandamelo") al primer email
  # con el gancho del mini-audit, este cron clasifica intent, genera el
  # PDF con los hallazgos cacheados, y lo envía con attachment.
  # Cada 15 min. Ventana: replies de últimas 72h sin clasificar.
  - type: cron
    name: empirika-reply-to-report
    env: node
    region: ohio
    schedule: "*/15 * * * *"
    buildCommand: npm install --include=dev
    startCommand: node workers/reply_to_report_cron.js
    envVars:
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: SMTP_USER
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_USER
      - key: SMTP_PASS
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SMTP_PASS
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: NVIDIA_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: NVIDIA_API_KEY
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"
      - key: REPLY_TO_REPORT_WINDOW_H
        value: "72"

  # ── Helena Autonomous Worker — Phase 2 ──
  # Long-lived worker: SEO/Content specialist that processes seo_audit /
  # blog_write / keyword_research messages from the agent_messages queue,
  # plus runs a proactive scan every loop tick to find brands due for an
  # audit (>7 days since last_audit_at) and notify Manager.
  # NOT a cron — runs 24/7 with internal heartbeat + exponential backoff
  # on Supabase outage. See workers/helena_autonomous.js.
  - type: worker
    name: empirika-helena-autonomous
    env: node
    region: ohio
    plan: starter   # smallest paid tier; free tier doesn't support 24/7 workers
    buildCommand: npm install --include=dev
    startCommand: node workers/helena_autonomous.js
    envVars:
      # Inherit secrets from the web service that already has them populated.
      # Avoids needing to set the same secret manually on every new worker.
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_SERVICE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_KEY
      - key: NVIDIA_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: NVIDIA_API_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: GEMINI_API_KEY
      - key: PRIMARY_LLM
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: PRIMARY_LLM
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"
      - key: HELENA_SLEEP_MS
        value: "20000"
      - key: AGENT_MAX_ITERATIONS
        value: "12"
      - key: NODE_ENV
        value: production

  # ── Manager Autonomous Worker — Phase 3 ──
  # Long-lived worker: Agency orchestrator. Processes seo_audit_proposal /
  # pattern_detected / delegate_request messages from the agent_messages
  # queue (currently from Helena, soon from Scout / Sam / others). Runs a
  # proactive coordination cycle every loop tick to scan the leads pipeline
  # and queue outreach batches for Sam when HOT/WARM leads accumulate.
  # NOT a cron — runs 24/7 with internal heartbeat + exponential backoff
  # on Supabase outage. See workers/manager_autonomous.js.
  - type: worker
    name: empirika-manager-autonomous
    env: node
    region: ohio
    plan: starter   # smallest paid tier; free tier doesn't support 24/7 workers
    buildCommand: npm install --include=dev
    startCommand: node workers/manager_autonomous.js
    envVars:
      # Inherit secrets from the web service (avoids manual per-worker setup).
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_SERVICE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_KEY
      - key: NVIDIA_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: NVIDIA_API_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: GEMINI_API_KEY
      - key: PRIMARY_LLM
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: PRIMARY_LLM
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"
      - key: MANAGER_SLEEP_MS
        value: "20000"
      - key: NODE_ENV
        value: production

  # ── Sam Autonomous Worker — Phase 5 ──
  # Long-lived worker: Paid Media Strategist. Processes outreach_batch_proposal /
  # outreach_batch_execute messages from the agent_messages queue (currently from
  # Manager). Runs a proactive queue-pressure scan every loop tick and notifies
  # Manager if >5 messages are backed up. Phase 5 v1: acknowledges proposals with
  # planned_send_at; real send flow TBD. NOT a cron — runs 24/7 with internal
  # heartbeat + exponential backoff on Supabase outage.
  # See workers/sam_autonomous.js.
  - type: worker
    name: empirika-sam-autonomous
    env: node
    region: ohio
    plan: starter   # smallest paid tier; free tier doesn't support 24/7 workers
    buildCommand: npm install --include=dev
    startCommand: node workers/sam_autonomous.js
    envVars:
      # Inherit secrets from the web service (avoids manual per-worker setup).
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_SERVICE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_KEY
      - key: NVIDIA_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: NVIDIA_API_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: GEMINI_API_KEY
      - key: PRIMARY_LLM
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: PRIMARY_LLM
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"
      - key: SAM_SLEEP_MS
        value: "20000"
      - key: NODE_ENV
        value: production

  # ── Fleet Multiplexed Worker — Phase 5 ──────────────────────
  # ONE Node process hosting 7 agents concurrently (scout, Carlos,
  # Kai, Verifier, Angela, DaVinci, Estratega). Each agent gets its
  # own AgentMessenger + heartbeat row. Scaffold only in Phase 5;
  # real per-agent LLM logic ships in Phase 6.
  # Cost: $7-14/mo vs $77/mo for 11 separate starter workers.
  # See workers/fleet_autonomous.js.
  - type: worker
    name: empirika-fleet-autonomous
    env: node
    region: ohio
    plan: starter
    buildCommand: npm install --include=dev
    startCommand: node workers/fleet_autonomous.js
    envVars:
      - key: SUPABASE_URL
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_SERVICE_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: SUPABASE_SERVICE_KEY
      - key: NVIDIA_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: NVIDIA_API_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: GEMINI_API_KEY
      - key: PRIMARY_LLM
        fromService:
          type: web
          name: agency-fleet-runtime
          envVarKey: PRIMARY_LLM
      - key: BRAND_ID
        value: "eca1d833-77e3-4690-8cf1-2a44db20dcf8"
      - key: FLEET_SLEEP_MS_PER_AGENT
        value: "25000"
      - key: NODE_ENV
        value: production

  # ── Lyra: Autonomous B2B Content Engine ──────────────────────
  # Runs Mon-Fri at 12:00 UTC (8:00 AM ET)
  # Pipeline: BrightData Research → Gemini Draft → Buffer → LinkedIn
  - type: cron
    name: lyra-daily-engine
    env: node
    region: ohio
    schedule: "0 12 * * 1-5"
    buildCommand: cd lyra-engine && npm install
    startCommand: cd lyra-engine && node index.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BRIGHTDATA_API_TOKEN
        sync: false
